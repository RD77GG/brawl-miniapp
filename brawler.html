<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Боец | Brawl Mini App</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/brawler.css">
</head>

<body>

    <button
        type="button"
        class="back"
        onclick="goBack()">

        ← Назад

    </button>


    <main id="brawler">

        <div class="loading">
            Загрузка...
        </div>

    </main>


    <!-- Полноэкранный просмотр скина -->

    <div
        id="skinViewer"
        class="skin-viewer"
        aria-hidden="true">

        <div
            class="skin-viewer-overlay"
            id="skinViewerOverlay">
        </div>


        <section
            class="skin-viewer-card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="viewerSkinName">

            <button
                type="button"
                class="skin-viewer-close"
                id="skinViewerClose"
                aria-label="Закрыть">

                ×

            </button>


            <div id="skinViewerContent"></div>

        </section>

    </div>


    <script src="js/brawler.js"></script>

    <script>

        function goBack(){

            window.location.href = "index.html";

        }

    </script>

</body>

</html>
